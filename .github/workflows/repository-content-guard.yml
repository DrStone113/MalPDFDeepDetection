name: Repository content guard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  repository-content-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with trusted baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate indexed source tree against original branch baseline
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ ! "$BASE_REF" =~ ^[0-9a-f]{40}$ ]] || [[ "$BASE_REF" =~ ^0{40}$ ]] || ! git rev-parse --verify "$BASE_REF^{commit}" >/dev/null 2>&1; then
            BASE_REF=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          fi
          python3 scripts/security/check_repo_content.py --baseline-ref "$BASE_REF"
  lab-workflow-synthetic:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline source, AST and synthetic security checks
        run: python -B scripts/lab/check_local.py --stdlib-only
  browser-session-security:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: configs/ci-web-security-requirements.txt
      - name: Install pinned security-test dependencies from wheels
        run: >-
          python -m pip install --only-binary=:all: -r configs/ci-web-security-requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify session boundaries and notification rendering in Chrome
        run: python -m pytest tests/test_browser_sessions.py tests/test_web_notifications.py -q --junitxml=artifacts/tmp/ci-web-security.xml
      - name: Preserve security-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-security-${{ matrix.os }}
          path: artifacts/tmp/ci-web-security.xml
          if-no-files-found: warn
