[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malpdf"
version = "0.1.0"
description = "Reproducible research tools for malicious PDF detection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "catboost>=1.2.8,<2",
    "esprima==4.0.1",
    "joblib>=1.3,<2",
    "lightgbm>=4.6,<5",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pikepdf==10.17.0",
    "pyarrow>=14,<20",
    "PyMuPDF==1.26.7",
    "zxing-cpp>=2.2,<3",
    "pypdf==6.18.1",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.3,<2",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "xgboost>=3.2,<3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "jsonschema==4.26.0", "fastapi>=0.115,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]

[project.scripts]
malpdf = "malpdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"malpdf.web" = ["templates/*.html", "static/*.css", "static/*.js", "static/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "scripts", "tests", "production"]
extend-exclude = ["data", "artifacts", "checkpoints", "graphify-out", ".venv*"]

[tool.ruff.lint]
select = ["E9", "F", "I", "W291", "W292", "W293", "S301", "B006"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["malpdf"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
