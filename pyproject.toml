[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malpdf"
version = "0.1.0"
description = "Reproducible research tools for malicious PDF detection."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "catboost>=1.2.8,<2",
    "esprima==4.0.1",
    "joblib>=1.3,<2",
    "lightgbm>=4.6,<5",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pikepdf==10.17.0",
    "pyarrow>=14,<20",
    "PyMuPDF==1.26.7",
    "pypdf==6.18.1",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.3,<2",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "xgboost>=3.2,<3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "jsonschema==4.26.0"]

[project.scripts]
malpdf = "malpdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
