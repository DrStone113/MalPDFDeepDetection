[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malpdf"
version = "0.1.0"
description = "Reproducible research tools for malicious PDF detection."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "joblib>=1.3,<2",
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "pyarrow>=14,<20",
    "PyMuPDF==1.26.7",
    "pypdf>=5.0,<6",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.3,<2",
    "xgboost>=3.2,<3.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
malpdf = "malpdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
